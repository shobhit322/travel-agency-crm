name: VI Studio verify

# Verification for the VI Studio Travel CRM customization, run on GitHub's runners (they can reach
# Packagist; the authoring environment cannot). It never deploys and uses no repository secrets:
#  1. style    - Pint on the PHP files this branch changed (fixes are committed back)
#  2. tests    - the full Pest suite (in-memory SQLite, as phpunit.xml configures)
#  3. preview  - boots the real app on a throwaway PostgreSQL 16 with the demo seed, drives it with
#                Chromium (desktop and phone), records HTTP statuses, and publishes screenshots to the
#                `vi-studio-screenshots` branch so the result can be looked at.

on:
  workflow_dispatch:
  push:
    branches: [vi-studio-branding]

permissions:
  contents: write

concurrency:
  group: vi-studio-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, gd, exif, gmp, mbstring, pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format the PHP files this branch added or changed
        run: |
          git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.php' > branch-php-files.txt
          echo "Files covered: $(wc -l < branch-php-files.txt)"
          vendor/bin/pint $(cat branch-php-files.txt)
          rm branch-php-files.txt
          if git diff --quiet; then
            echo "Already formatted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Apply Pint formatting to the VI Studio files [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "::notice title=Pint::Formatting fixes were committed to the branch"
          fi

  tests:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, gd, exif, gmp, mbstring, pdo_sqlite, pdo_pgsql
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Pest (full suite)
        run: |
          php artisan config:clear
          vendor/bin/pest --compact --log-junit junit.xml

      - name: Report Pest totals
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('junit.xml').getroot().iter('testcase'))
          def bad(c, tag): return c.find(tag) is not None
          failed = [c for c in cases if bad(c, 'failure') or bad(c, 'error')]
          skipped = sum(bad(c, 'skipped') for c in cases)
          print(f"::notice title=Pest totals::{len(cases)} tests, {len(failed)} failed, {skipped} skipped")
          for c in failed[:12]:
              print(f"::warning title=Pest failure::{(c.get('classname') or '')} :: {c.get('name')}")
          for needle in ('DemoRequestTest', 'VIStudioBrandingTest', 'TenantBrandingTest', 'ExampleTest', 'AdminDashboardWidgetsTest'):
              mine = [c for c in cases if needle in (c.get('file') or '') + (c.get('classname') or '')]
              mine_failed = sum(bad(c, 'failure') or bad(c, 'error') for c in mine)
              print(f"::notice title=Pest {needle}::{len(mine)} tests ran, {mine_failed} failed")
          PY

  preview:
    needs: style
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: ci
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-throwaway
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, gd, exif, gmp, mbstring, pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Migrate and demo-seed the throwaway database
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          set -a; . "$GITHUB_ENV"; set +a
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start the app
        run: |
          set -a; . "$GITHUB_ENV"; set +a
          # Serve static files from public/ and everything else through Laravel. `artisan serve` is not
          # used because it hides the job's environment variables from the app it starts.
          cat > /tmp/router.php <<'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if ($path !== '/' && is_file($_SERVER['DOCUMENT_ROOT'].$path)) { return false; }
          require $_SERVER['DOCUMENT_ROOT'].'/index.php';
          PHP
          export PHP_CLI_SERVER_WORKERS=4
          nohup php -S 127.0.0.1:8000 -t public /tmp/router.php > serve.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/up || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "::notice title=App boot::/up returned $code"

      - name: Screenshots and checks (Chromium)
        run: |
          mkdir -p shots
          npm install --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node .github/scripts/vi-studio-screenshots.mjs

      - name: Laravel log (if anything failed)
        if: failure()
        run: |
          tail -n 60 storage/logs/laravel.log 2>/dev/null | cut -c1-300 || true
          tail -n 40 serve.log | cut -c1-300 || true

      - name: Publish screenshots to the vi-studio-screenshots branch
        if: always()
        run: |
          mkdir -p shots
          cd shots
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b vi-studio-screenshots
          git add -A
          git commit -q --allow-empty -m "Screenshots for ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin vi-studio-screenshots
